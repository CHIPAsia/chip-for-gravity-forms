name: WordPress Plugin Check (Main)

on:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare plugin folder for CI
        run: |
          mkdir -p ci-build/chip-for-gravity-forms
          git archive HEAD | tar -x -C ci-build/chip-for-gravity-forms
          # Deliberately NOT copied in: .wp-env.json. The action writes its own
          # config in the working directory (repo root) and starts wp-env from
          # there; it only excludes a .wp-env.json that IT created. One already
          # present inside build-dir is scanned as part of the plugin and
          # reported as `hidden_files: Hidden files are not permitted.`
          # That copy is why this job failed on every run since it was added.

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './ci-build/chip-for-gravity-forms'
          exclude-directories: 'vendor,node_modules'
